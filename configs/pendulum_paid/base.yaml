dataset: pivae
dataset_config:
  dir: ./data/pivae
  system: pendulum
  batch_size: 64
  retain_dim: true
  length: 0.0
  time: 2.5
  x_grid: 1
  t_grid: 50
  phys_param_ranges:
    - [0.7853981633974483, 3.141592653589793] # omega
    - [0.0, 0.8] # xi
    - [3.141592653589793, 6.283185307179586] # phi
    - [0.0, 40.0] # A
  seed: 169800
  n_samples: 3000
  test_split: 1000
  validation_split: 500
  train_split: 1000

model: paid
model_config:
  pde:
    integral_level: 1.0
    solver: euler

    phys_param_ranges:
      - [0.392, 3.53]

  aux_funcs:
    - latent_dim: 1
      dims: [32, 32]
      act: swish
    - latent_dim: 2
      dims: [32, 32]
      act: swish

  unmixer:
    dims: [64, 64]
    act: swish

  phys_funcs:
    - latent_dim: 1
      dims: [32, 32]
      act: swish

  pre_funcs:
    - latent_dim: 1
      dims: [64, 64]
      act: swish

  post_funcs:
    - latent_dim: 1
      dims: [32, 32]
      act: swish

  num_timesteps: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

  disc_reg: 1e-2
  phys_reg: 1e-3
  aug_reg: 1e-1

  pad:
    - [1, 1]

trainer_config:
  learning_rate: 1e-3
  eps: 1e-3
  epochs: 100

checkpoint_dir: checkpoints/pendulum_paid
