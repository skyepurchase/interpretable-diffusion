dataset: pivae
dataset_config:
  dir: ./data/pivae
  system: pendulum
  batch_size: 64
  retain_dim: true
  length: 0.0
  time: 2.5
  x_grid: 1
  t_grid: 50
  n_samples: 200
  test_split: 50
  validation_split: 50
  train_split: 100

model: paid
model_config:
  pde:
    integral_level: 1.0
    solver: euler

    phys_param_ranges:
      - [0.392, 3.53]

  aux_funcs:
    - latent_dim: 1
      dims: [32]
      act: swish
    - latent_dim: 1
      dims: [32]
      act: swish

  unmixer:
    dims: [64, 64]
    act: swish

  phys_funcs:
    - latent_dim: 1
      dims: [32]
      act: swish

  pre_funcs:
    - latent_dim: 1
      dims: [64, 64]
      act: elu

  post_funcs:
    - latent_dim: 1
      dims: [32]
      act: swish

  num_timesteps: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

  disc_reg: 1e-2
  phys_reg: 1e-3
  aug_reg: 1e-1

  pad:
    - [1, 1]

trainer_config:
  learning_rate: 1e-3
  eps: 1e-3
  weight_decay: 1.0e-6
  grad_clip: 5.0
  epochs: 3

checkpoint_dir: checkpoints/smoke_paid
