dataset: pivae
dataset_config:
  dir: ./data/pivae
  system: pendulum
  batch_size: 64
  x_grid: 1
  retain_dim: True

model: paid
model_config:
  unet:
    in_channels: 1
    ch: 32
    ch_mult: [1, 2, 2]
    num_res_blocks: 1
    attention_resolutions: [2]
    num_heads: 4
    activation: swish
    dropout: True
    dropout_rate: 0.1

  pde:
    system: pendulum
    time_dim: 50
    integral_level: 1.0
    timestep: 0.05
    spatial_length: -1
    num_grid_points: 1
    solver: euler

    phys_param_ranges:
      - [0.392, 3.53]

  aux_funcs:
    - latent_dim: 1
      in_features: -1
      features: 32
      act: swish
      dropout: True
      dropout_rate: 0.1
    - latent_dim: 2
      in_features: -1
      features: 32
      act: swish
      dropout: True
      dropout_rate: 0.1

  unmixer:
    dims: [64, 64]
    act: swish
    dropout: True
    dropout_rate: 0.1

  phys_funcs:
    - latent_dim: 1
      in_features: -1
      features: 32
      act: swish
      dropout: True
      dropout_rate: 0.1

  pre_funcs:
    - latent_dim: 1
      dims: [64, 64]
      act: swish

  post_funcs:
    - latent_dim: 1
      in_features: -1
      features: 32
      act: swish
      dropout: True
      dropout_rate: 0.1


  num_timesteps: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

  disc_reg: 1e-2
  phys_reg: 1e-3
  aug_reg: 1e-1

  pad:
    - [1, 1]

  condition: [CONDITION]

trainer_config:
  learning_rate: 1e-3
  eps: 1e-3
  epochs: 100

checkpoint_dir: checkpoints/pendulum_paid
