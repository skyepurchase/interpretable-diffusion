dataset: pivae
dataset_config:
  dir: ./data/pivae
  system: pendulum
  batch_size: 64
  retain_dim: true
  length: 0.0
  time: 2.5
  x_grid: 1
  t_grid: 50
  n_samples: 3000
  test_split: 1000
  validation_split: 500
  train_split: 1000

model: paid
model_config:
  pde:
    integral_level: 1
    solver: euler
    phys_param_ranges:
      - [0.392, 3.53]

  # One auxiliary function per pre/post function; the first feeds the
  # in-ODE pre-function, the second the out-ODE post-function
  aux_funcs:
    - latent_dim: 1
      dims: [128, 128]
      act: swish
    - latent_dim: 2
      dims: [128, 128]
      act: swish

  unmixer:
    dims: [64, 64]
    act: swish

  phys_funcs:
    - latent_dim: 1
      dims: [128, 128]
      act: swish

  pre_funcs:
    - latent_dim: 1
      dims: [64, 64]
      act: elu

  # Post-functions take the decoded series plus the physics and all prior
  # auxiliary latents, so the ordering of this list is meaningful
  post_funcs:
    - latent_dim: 2
      dims: [128, 128]
      act: swish

  num_timesteps: 1000
  beta_schedule: linear
  beta_start: 1.0e-4
  beta_end: 0.02

  # The original pendulum physnn recipe weights
  disc_reg: 1.0e-2
  phys_reg: 1.0e-3
  aug_reg: 1.0e-1

  condition: 5
  embed_dim: 128
  jump: 10
  # The original pendulum's in-ODE auxiliary time input
  time_encoding: raw

trainer_config:
  learning_rate: 1.0e-3
  eps: 1.0e-3
  weight_decay: 1.0e-6
  grad_clip: 5.0
  epochs: 100

checkpoint_dir: checkpoints/pendulum_paid
