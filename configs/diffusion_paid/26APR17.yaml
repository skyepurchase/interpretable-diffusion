dataset: pivae
dataset_config:
  dir: ./data/pivae
  system: diffusion
  batch_size: 200
  retain_dim: True

model: paid
model_config:
  unet:
    in_features: 1
    base_features: 32
    feature_multiples: [1, 2, 2]
    num_blocks: 1
    attention_resolutions: [2]
    attention_heads: 4
    act: swish
    dropout: True
    dropout_rate: 0.1

  pde:
    system: diffusion
    time_dim: 50
    integral_level: 1.0
    timestep: 0.05
    length: 2.0
    num_grid_points: 12
    solver: euler

    phys_param_ranges:
      - [0.01, 0.1]

  aux_funcs:
    - latent_dim: 4
      in_features: 1248
      features: 32
      act: swish
      dropout: True
      dropout_rate: 0.1
    - latent_dim: 1
      in_features: 1248
      features: 32
      act: swish
      dropout: True
      dropout_rate: 0.1

  unmixer:
    dims: [64, 64]
    act: swish
    dropout: True
    dropout_rate: 0.1

  phys_funcs:
    - latent_dim: 1
      in_features: 1248
      features: 32
      act: swish
      dropout: True
      dropout_rate: 0.1

  pre_funcs:
    - latent_dim: 4
      dims: [64, 64]
      act: elu

  post_funcs: []

  num_timesteps: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

  alpha: 1e-1
  beta: 1e-2
  gamma: 1e4

  pad:
    - [1, 1]
    - [0, 0]

trainer_config:
  lr: 1e-3
  eps: 1e-3
  epochs: 100
  snapshot_freq: 1

checkpoint_dir: checkpoints/diffusion_paid
