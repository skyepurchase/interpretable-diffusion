dataset: pivae
dataset_config:
  dir: ./data/pivae
  system: diffusion
  batch_size: 16
  retain_dim: true
  length: 2.0
  time: 1.0
  x_grid: 12
  t_grid: 50
  phys_param_ranges:
    - [0.01, 0.1]
    - [0.01, 0.1]
  n_samples: 3000
  test_split: 1000
  validation_split: 500
  train_split: 1000

model: paid
model_config:
  unet:
    in_channels: 1
    ch: 32
    ch_mult: [1, 2, 2]
    num_res_blocks: 1
    attention_resolutions: [2]
    num_heads: 4
    activation: swish
    dropout: true
    dropout_rate: 0.1

  pde:
    integral_level: 1.0
    solver: euler

    phys_param_ranges:
      - [0.01, 0.1]

  aux_funcs:
    - latent_dim: 4
      in_features: -1
      features: 32
      act: swish
      dropout: true
      dropout_rate: 0.1
    - latent_dim: 1
      in_features: -1
      features: 32
      act: swish
      dropout: true
      dropout_rate: 0.1

  unmixer:
    dims: [64, 64]
    act: swish
    dropout: true
    dropout_rate: 0.1

  phys_funcs:
    - latent_dim: 1
      in_features: -1
      features: 32
      act: swish
      dropout: true
      dropout_rate: 0.1

  pre_funcs:
    - latent_dim: 4
      dims: [64, 64]
      act: elu

  post_funcs: []

  num_timesteps: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

  disc_reg: 1e-1
  phys_reg: 1e-2
  aug_reg: 1e4

  pad:
    - [1, 1]
    - [0, 0]

trainer_config:
  learning_rate: 1e-3
  eps: 1e-3
  weight_decay: 1.0e-6
  grad_clip: 5.0
  epochs: 100

checkpoint_dir: checkpoints/diffusion_paid
