dataset: pivae
dataset_config:
  dir: ./data/pivae
  system: diffusion
  batch_size: 16
  retain_dim: true
  length: 2.0
  time: 1.0
  x_grid: 12
  t_grid: 50
  phys_param_ranges:
    - [0.01, 0.1]
    - [0.01, 0.1]
  seed: 169800
  n_samples: 3000
  test_split: 1000
  validation_split: 500
  train_split: 1000

model: paid
model_config:
  pde:
    integral_level: 1.0
    solver: euler

    phys_param_ranges:
      - [0.01, 0.1]

  aux_funcs:
    - latent_dim: 4
      dims: [32, 32]
      act: swish
    - latent_dim: 1
      dims: [32, 32]
      act: swish

  unmixer:
    dims: [64, 64]
    act: swish

  phys_funcs:
    - latent_dim: 1
      dims: [32, 32]
      act: swish

  pre_funcs:
    - latent_dim: 4
      dims: [64, 64]
      act: elu

  post_funcs: []

  num_timesteps: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

  disc_reg: 1e-1
  phys_reg: 1e-2
  aug_reg: 1e4

  pad:
    - [1, 1]
    - [0, 0]

trainer_config:
  learning_rate: 1e-3
  eps: 1e-3
  epochs: 100

checkpoint_dir: checkpoints/diffusion_paid
