dataset: pdebench
dataset_config:
  dir: ./data/pdebench
  system: burgers
  batch_size: 8

model: paid
model_config:
  unet:
    in_features: 1
    base_features: 32
    feature_multiples: [1, 1, 1, 2]
    num_blocks: 1
    attention_resolutions: []
    attention_heads: 4
    act: swish
    dropout: True
    dropout_rate: 0.1

  pde:
    system: diffusion
    time_dim: 201
    integral_level: 1
    timestep: 0.01
    spatial_length: 1.
    num_grid_points: 128
    solver: euler

    phys_param_ranges:
      - [0.0001, 0.001]

  aux_funcs:
    - latent_dim: 4
      in_features: -1
      features: 32
      act: swish
      dropout: True
      dropout_rate: 0.1

  unmixer:
    dims: [64, 64]
    act: swish
    dropout: True
    dropout_rate: 0.1

  phys_funcs:
    - latent_dim: 1
      in_features: -1
      features: 32
      act: swish
      dropout: True
      dropout_rate: 0.1

  pre_funcs:
    - latent_dim: 4
      dims: [32, 32]
      act: elu

  post_funcs: []

  num_timesteps: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

  alpha: 1
  beta: 1
  gamma: 1

  pad:
    - [0, 7]
    - [0, 0]

trainer_config:
  lr: 1e-3
  eps: 1e-3
  epochs: 100
  snapshot_freq: 1

checkpoint_dir: checkpoints/burgers_paid
