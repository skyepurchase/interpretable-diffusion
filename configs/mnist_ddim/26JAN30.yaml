dataset: mnist
dataset_config:
  dir: ./data/MNIST
  download: true
  batch_size: 128

model: ddim
model_config:
  in_features: 1
  base_features: 32
  feature_multiples: [1, 2, 2]
  num_blocks: 1
  attention_resolutions: [2]
  attention_heads: 4
  act: swish
  dropout: True
  dropout_rate: 0.1
  num_timesteps: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

trainer_config:
  lr: 1e-3
  epochs: 12
  snapshot_freq: 1

checkpoint_dir: checkpoints/mnist_ddim
