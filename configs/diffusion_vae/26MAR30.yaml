dataset: pivae
dataset_config:
  dir: ./data/pivae
  system: diffusion
  batch_size: 200
  retain_dim: true
  length: 2.0
  time: 1.0
  x_grid: 12
  t_grid: 50
  phys_param_ranges:
    - [0.01, 0.1]
    - [0.01, 0.1]
  seed: 169800
  n_samples: 3000
  test_split: 1000
  validation_split: 500
  train_split: 1000

model: phys_vae
model_config:
  encoder:
    aux_funcs:
      - latent_dim: 4
        dims: [256, 256, 256, 64, 32]
        act: elu
    unmixer:
      latent_dim: -1 # Unnecessary
      dims: [256, 256]
      act: elu
      residual: false
    phys_funcs:
      - latent_dim: 1
        dims: [256, 256, 256, 64, 32]
        act: elu

  decoder:
    pre_funcs:
      - latent_dim: 4
        dims: [64, 64]
        act: elu
    post_funcs: []
    x_log_sigma: 0.01

  phys_param_ranges:
    - [0.01, 0.1]

  integral_level: 1
  ode_solver: euler

  kl_balance: 1.0
  alpha: 1.0e-1
  beta: 1.0e-2
  gamma: 1.0

trainer_config:
  learning_rate: 1.0e-3
  eps: 1.0e-3
  epochs: 100

checkpoint_dir: checkpoints/diffusion_vae
