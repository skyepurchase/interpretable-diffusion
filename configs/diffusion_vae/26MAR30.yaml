dataset: pivae
dataset_config:
  dir: ./data/pivae
  system: diffusion
  batch_size: 200

model: phys_vae
model_config:
  encoder:
    aux_funcs:
      - latent_dim: 4
        dims: [256, 256, 256, 64, 32]
        act: elu
    unmixer:
      latent_dim: -1 # Unnecessary
      dims: [256, 256]
      act: elu
      residual: False
    phys_funcs:
      - latent_dim: 1
        dims: [256, 256, 256, 64, 32]
        act: elu

  decoder:
    pre_funcs:
      - latent_dim: 4
        dims: [64, 64]
        act: elu
    post_funcs: []
    x_log_sigma: 0.01

  phys_param_ranges:
    - [0.01, 0.1]

  system: diffusion
  time_dim: 50
  integral_level: 1
  timestep: 0.05
  length: 2.0
  num_grid_points: 12
  ode_solver: euler

  alpha: 0.1
  beta: 0.01
  gamma: 1

trainer_config:
  learning_rate: 1e-3
  eps: 1e-3
  epochs: 100

checkpoint_dir: checkpoints/diffusion_vae
