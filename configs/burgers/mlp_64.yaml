dataset: burgers
dataset_config:
  dir: ./data/burgers
  system: diffusion
  batch_size: 256
  retain_dim: true
  length: 1.0
  time: 0.1
  x_grid: 256
  t_grid: 128
  phys_param_ranges:
    - [0.001, 0.01]
  n_samples: 3000
  test_split: 1000
  validation_split: 500
  train_split: 1000

model: paid
model_config:
  pde:
    gen_steps: 64
    integral_level: 2
    solver: euler
    phys_param_ranges:
      - [0.0005, 0.02]

  aux_funcs:
    - latent_dim: 4
      dims: [256, 256, 256, 64, 32]
      act: swish
    - latent_dim: 2
      dims: [256, 256, 256, 64, 32]
      act: swish

  unmixer:
    dims: [256, 256]
    act: swish

  phys_funcs:
    - latent_dim: 1
      dims: [256, 256, 256, 64, 32]
      act: swish

  pre_funcs:
    - latent_dim: 4
      dims: [64, 64]
      act: swish

  post_funcs:
    - latent_dim: 2
      dims: [128, 128]
      act: swish

  num_timesteps: 1000
  beta_schedule: linear
  beta_start: 1.0e-4
  beta_end: 0.02

  disc_reg: 1.0e-1
  phys_reg: 1.0e-1
  aug_reg: 1.0e8

  condition: 64
  embed_dim: 128
  jump: 10

trainer_config:
  learning_rate: 1.0e-3
  eps: 1.0e-3
  weight_decay: 1.0e-6
  grad_clip: 5.0
  epochs: 10000
  ckpt_interval: 100

checkpoint_dir: checkpoints/burgers_paid
