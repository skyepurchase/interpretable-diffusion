dataset: burgers
dataset_config:
  dir: ./data/burgers
  system: diffusion # the physics model of the PAID denoiser; generation uses burgers
  batch_size: 32
  retain_dim: true
  length: 1.0
  time: 0.1
  x_grid: 128
  t_grid: 128
  phys_param_ranges:
    - [0.001, 0.01]
  seed: 169800
  n_samples: 3000
  test_split: 1000
  validation_split: 500
  train_split: 1000

model: paid
model_config:
  pde:
    integral_level: 1
    solver: euler

    phys_param_ranges:
      - [0.001, 0.01]

  aux_funcs:
    - latent_dim: 4
      dims: [32, 32]
      act: swish
    - latent_dim: 2
      dims: [32, 32]
      act: swish

  unmixer:
    dims: [64, 64]
    act: swish

  phys_funcs:
    - latent_dim: 1
      dims: [32, 32]
      act: swish

  pre_funcs:
    - latent_dim: 4
      dims: [32, 32]
      act: elu

  post_funcs:
    - latent_dim: 2
      dims: [32, 32]
      act: swish

  num_timesteps: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

  disc_reg: 1e-2
  phys_reg: 1e-1
  aug_reg: 1e8

  pad:
    - [0, 0]
    - [0, 0]

trainer_config:
  learning_rate: 1e-3
  eps: 1e-3
  epochs: 100

checkpoint_dir: checkpoints/burgers_paid
