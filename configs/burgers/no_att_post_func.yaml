dataset: burgers
dataset_config:
  dir: ./data/burgers
  system: ""
  batch_size: 32
  retain_dim: True

model: paid
model_config:
  unet:
    in_channels: 1
    ch: 32
    ch_mult: [1, 1, 1, 2]
    num_res_blocks: 1
    attention_resolutions: []
    num_heads: 1
    activation: swish
    dropout: True
    dropout_rate: 0.1

  pde:
    system: diffusion
    time_dim: 128
    integral_level: 1
    timestep: 0.00078125
    spatial_length: 1.
    num_grid_points: 128
    solver: euler

    phys_param_ranges:
      - [0.001, 0.01]

  aux_funcs:
    - latent_dim: 4
      in_features: -1
      features: 32
      act: swish
      dropout: True
      dropout_rate: 0.1
    - latent_dim: 2
      in_features: -1
      features: 32
      act: swish
      dropout: True
      dropout_rate: 0.1

  unmixer:
    dims: [64, 64]
    act: swish
    dropout: True
    dropout_rate: 0.1

  phys_funcs:
    - latent_dim: 1
      in_features: -1
      features: 32
      act: swish
      dropout: True
      dropout_rate: 0.1

  pre_funcs:
    - latent_dim: 4
      dims: [32, 32]
      act: elu

  post_funcs:
    - latent_dim: 2
      in_features: -1
      features: 32
      act: swish
      dropout: True
      dropout_rate: 0.1

  num_timesteps: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

  disc_reg: 1e-2
  phys_reg: 1e-1
  aug_reg: 1e8

  pad:
    - [0, 0]
    - [0, 0]

trainer_config:
  learning_rate: 1e-3
  eps: 1e-3
  epochs: 100

checkpoint_dir: checkpoints/burgers_paid
