dataset: mnist
dataset_config:
  dir: ./data/MNIST
  download: true
  batch_size: 128

model: vae
model_config:
  encoder:
    - type: conv
      config:
        in_features: 1
        out_features: 16
        kernel_size: [3,3]
        strides: [3,3]
        padding: valid
        act: relu
    - type: maxpool
      config:
        window_shape: (3,3)
        strides: (1,1)
    - type: conv
      config:
        in_features: 16
        out_features: 32
        kernel_size: [3,3]
        strides: [3,3]
        padding: valid
        act: relu
    - type: flatten
      config: {}
    - type: linear
      config:
        in_features: 128
        out_features: 32
        act: relu
    - type: linear
      config:
        in_features: 32
        out_features: 4
        act: relu
  decoder:
    - type: conv
      config:
        in_features: 6
        out_features: 32
        kernel_size: [3,3]
        strides: null
        padding: same
        act: relu
    - type: upsample
      config:
        shape: [15,15]
        method: bilinear
    - type: conv
      config:
        in_features: 32
        out_features: 16
        kernel_size: [3,3]
        strides: null
        padding: valid
        act: relu
    - type: upsample
      config:
        shape: [30,30]
        method: bilinear
    - type: conv
      config:
        in_features: 16
        out_features: 1
        kernel_size: [3,3]
        strides: null
        padding: valid
        act: sigmoid
  latent_dim: 2
  channel_start: 6
  initial_shape: 7
  output_shape: 28
  eps: 1e-6

trainer_config:
  learning_rate: 1e-3
  epochs: 15

checkpoint_dir: checkpoints/mnist_vae
